<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0">
  <title>PostService - Список відправлень</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
<!--Список відправлень-->
  <div id="list-screen" class="screen">
    <header class="header">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" 
             fill="none" stroke="white" stroke-width="2.2" 
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 
                  0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 
                  2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        PostService
      </div>
      <div class="icons">
        <svg width="18" height="18" viewBox="0 0 24 24" 
             fill="none" stroke="white" stroke-width="2" 
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <svg width="18" height="18" viewBox="0 0 24 24" 
             fill="none" stroke="white" stroke-width="2" 
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </header>
    <div class="sub-header">
      <button class="back-btn" onclick="window.location.href='index.html'">‹</button>
      <span class="sub-header-title">Список відправлень</span>
    </div>
    <main class="scroll-content">
    </main>
  </div>

<!--Модальна форма видалення-->
  <div id="delete-modal" class="modal-overlay" style="display: none;">
    <div class="delete-sheet">
      <div class="sheet-indicator"></div>
      <div class="warning-icon-wrap">
        <svg width="28" height="28" viewBox="0 0 24 24" 
        fill="none" stroke="#d32f2f" stroke-width="2" 
        stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 
          2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <h3 class="delete-title">Видалити відправлення?</h3>
      <p class="delete-desc">Ви впевнені, що хочете видалити це відправлення? 
                             Цю дію неможливо буде скасувати.</p>
      <button class="btn-delete-action" onclick="confirmDelete()">Видалити</button>
      <button class="btn-cancel-action" onclick="closeDeleteModal()">Скасувати</button>
    </div>
  </div>
</div>
<script src="Service/PostServiceWebClient.js"></script>
<script src="storage.js"></script>
<script src="script.js"></script>
</body>
</html>
